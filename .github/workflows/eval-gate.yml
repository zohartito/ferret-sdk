name: Eval Gate

# EVENT loop: golden-baseline reconstruction eval as a push gate.
# The repo's CI runs `pytest -q`, which does NOT collect tests/eval_reconstruct.py
# (its name is outside the default test_*.py glob), so the golden baseline is
# otherwise never enforced. This gate runs it explicitly on every push.

on:
  push:
    paths:
      - "ferret/**"
      - "tests/eval_reconstruct.py"
      - "tests/eval_reconstruct_baseline.json"
      - "tests/eval_gate.py"
      - ".github/workflows/eval-gate.yml"
      - "requirements.txt"
      - "requirements-lock.txt"
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Golden-baseline eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Run golden-baseline eval gate
        run: python tests/eval_gate.py --ci | tee eval-gate-result.json
      - name: Upload eval result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-gate-result
          path: eval-gate-result.json
